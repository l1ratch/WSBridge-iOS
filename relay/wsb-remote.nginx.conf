# WSBridge Relay — nginx для ВЫДЕЛЕННОГО ПОДДОМЕНА.
#
# Идея: весь поддомен (например wsb-remote.example.com) = мост.
# Снаружи — обычный HTTPS+WS-сервис на своём домене, профиль
# корпоративного remote-access. Порт релея наружу не торчит.
#
# Страница-заглушка для браузера/пробинга отдаётся САМИМ релеем
# (relay.py, _LANDING_HTML), поэтому nginx здесь простой и без `if`:
# всё, что пришло на поддомен, проксируется на релей, а релей сам
# решает — WS-апгрейд или обычная страница.
#
# ── УСТАНОВКА ────────────────────────────────────────────────────────
#  1. DNS: A-запись  wsb-remote.example.com -> IP вашего VDS
#  2. Файлы:
#       sudo cp wsb-remote.nginx.conf /etc/nginx/sites-available/wsb-remote
#       sudo ln -s /etc/nginx/sites-available/wsb-remote /etc/nginx/sites-enabled/
#  3. Заменить wsb-remote.example.com на свой поддомен (server_name x2).
#  4. Сертификат (сам пропишет пути в этом файле):
#       sudo certbot --nginx -d wsb-remote.example.com
#  5. Проверка:  sudo nginx -t && sudo systemctl reload nginx
#
# До шага 4 закомментируйте две строки ssl_certificate — иначе nginx не
# стартует без сертификата.
#
# Релей должен слушать 127.0.0.1:2087 (так в docker-compose.yml).
# Порт 2087 наружу НЕ открывать:
#       sudo ufw delete allow 2087/tcp   # если открывали раньше

# WebSocket-апгрейд. map должен быть в http{}, а не в server{} —
# файлы из sites-available обычно инклюдятся внутрь http{}, так что это ок.
map $http_upgrade $wsb_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # http2 намеренно НЕ включаем: WS поверх HTTP/2 требует extended CONNECT
    # (RFC 8441) с поддержкой на обоих концах. На HTTP/1.1 апгрейд работает
    # всегда, а для моста h2 не даёт ничего.
    # http2 off;

    # ── ЗАМЕНИТЬ на свой поддомен ──
    server_name wsb-remote.example.com;

    # ── certbot создаст эти файлы ──
    ssl_certificate     /etc/letsencrypt/live/wsb-remote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wsb-remote.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WSB:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS намеренно не ставим: при поломке сертификата браузеры оказались бы
    # заблокированы на год, а выгоды для маскировки это не даёт.

    # ── Всё на релей: и WS, и обычную страницу отдаёт он сам ──────────
    location / {
        proxy_pass http://127.0.0.1:2087;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wsb_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MTProto-сессии живут часами; стандартные 60с их убивали бы.
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Без буферизации: WS-кадры идут как есть, без накопления задержки.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/wsb-remote.access.log;
    error_log  /var/log/nginx/wsb-remote.error.log warn;
}

# HTTP -> HTTPS. certbot может добавить свой блок — тогда этот можно удалить.
server {
    listen 80;
    listen [::]:80;
    server_name wsb-remote.example.com;
    return 301 https://$host$request_uri;
}
