name: WSBridge

# ── Версия: X.Y.N ──────────────────────────────────────────────────
# X — глобальные изменения. Поднимается ВРУЧНУЮ и только по явной
#     команде («выложи релизную версию»). Пока ни разу не поднимался.
# Y — крупные изменения: поднимается на каждом СТАБИЛЬНОМ релизе,
#     тоже вручную, по явной команде.
# N — номер сборки CI. КАЖДАЯ сборка в превью публикует текущий N и
#     САМА же поднимает его здесь до N+1 для следующего пуша. Число
#     монотонное, не сбрасывается при смене X/Y (CFBundleVersion обязан
#     расти). Здесь лежит номер СЛЕДУЮЩЕЙ сборки.
#
# WSB_VERSION = "X.Y" (строка), WSB_BUILD = N (число).
# Итог "<WSB_VERSION>.<WSB_BUILD>" (сейчас 0.3.13) идёт в
# CFBundleShortVersionString, в UI и в манифест GBox. Отдельного
# «номера сборки в скобках» нигде нет, CFBundleVersion = WSB_BUILD.
#
# Превью: пуш в main → build.yml бампит N, собирает и ОБНОВЛЯЕТ один
#         и тот же prerelease «preview» + gh-pages. Теги v* не создаются.
# Релиз:  только по явной команде — вручную поднять X/Y (при желании и
#         N) здесь, запушить тег vX.Y.N → сработает release.yml.
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    WSB_VERSION: "0.3"
    WSB_BUILD: "13"

options:
  bundleIdPrefix: com.l1ratch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  WSBridge:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WSBridge
        # Версия = "<WSB_VERSION>.<WSB_BUILD>" → 0.3.0; сборка отдельно
        # нигде не показывается.
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_VERSION).$(WSB_BUILD)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        # Приложение не использует шифрование, требующее экспортной
        # декларации: CommonCrypto применяется только к трафику самого
        # туннеля, наружу как продукт шифрования не поставляется.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/WSBridge.entitlements
      properties:
        com.apple.developer.networking.vpn.api: [allow-vpn]
    dependencies:
      - target: WSBridgeTunnel
      - target: WSBridgeLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WSBridgeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "lwip/**"
          - "lwipopts.h"
          - "lwip_bridge.h"
      - path: Tunnel/lwip
        headerVisibility: private
        excludes:
          - "**/makefsdata/**"
          - "**/makefsdata.c"
      - path: Tunnel/lwip_bridge.c
      - path: Tunnel/lwipopts.h
        headerVisibility: private
      - path: Tunnel/arch
        headerVisibility: private
      # Манифест приватности нужен каждому бандлу отдельно: расширение
      # тоже читает UserDefaults (статистика фронтов, журнал событий).
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Общий тип прокси (парсинг URL) — нужен extension'у (коннект)
      # и app'у (настройки/тест). Тестер в extension не линкуем: он
      # только для UI.
      - path: Shared/ProxyEndpoint.swift
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: WSBridge Tunnel
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_VERSION).$(WSB_BUILD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/WSBridgeTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/WSBridgeTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Tunnel", "$(SRCROOT)/Tunnel/lwip/include"]
        GCC_C_LANGUAGE_STANDARD: c11
        CLANG_ENABLE_MODULES: NO

  # Live Activity (Dynamic Island / локскрин): молния + системный таймер
  # аптайма. UI живёт здесь, стартует/гасит активность приложение.
  WSBridgeLive:
    type: app-extension
    platform: iOS
    sources: [Live, Shared]
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: WSBridge Live
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_VERSION).$(WSB_BUILD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge.live

schemes:
  WSBridge:
    build:
      targets:
        WSBridge: all
