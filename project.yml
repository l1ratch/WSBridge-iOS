name: WSBridge
options:
  bundleIdPrefix: com.l1ratch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WSBridge:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WSBridge
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "81"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/WSBridge.entitlements
      properties:
        com.apple.developer.networking.vpn.api: [allow-vpn]
    dependencies:
      - target: WSBridgeTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WSBridgeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "lwip/**"
          - "lwipopts.h"
          - "lwip_bridge.h"
      - path: Tunnel/lwip
        headerVisibility: private
        excludes:
          - "**/makefsdata/**"
          - "**/makefsdata.c"
      - path: Tunnel/lwip_bridge.c
      - path: Tunnel/lwipopts.h
        headerVisibility: private
      - path: Tunnel/arch
        headerVisibility: private
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: WSBridge Tunnel
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "81"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/WSBridgeTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/WSBridgeTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Tunnel", "$(SRCROOT)/Tunnel/lwip/include"]
        GCC_C_LANGUAGE_STANDARD: c11
        CLANG_ENABLE_MODULES: NO

schemes:
  WSBridge:
    build:
      targets:
        WSBridge: all
