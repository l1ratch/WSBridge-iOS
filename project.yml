name: WSBridge

# ── Версия: ОДНО число на весь проект ──────────────────────────────
# WSB_BUILD — единственное, что правится при релизе. Из него выводятся
# и версия (0.2.N), и номер сборки (N). Раньше номер жил в четырёх
# местах (два таргета × два ключа) и разъезжался: в UI одно, в CI другое.
# CI (build.yml) читает CFBundleVersion из этого же WSB_BUILD.
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    WSB_BUILD: "100"
    WSB_MARKETING_VERSION: "0.2.$(WSB_BUILD)"

options:
  bundleIdPrefix: com.l1ratch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  WSBridge:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WSBridge
        # CFBundleVersion обязан быть числом (App Store/GBox) — берём
        # из WSB_BUILD как есть; CFBundleShortVersionString — 0.2.N.
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
    entitlements:
      path: App/WSBridge.entitlements
      properties:
        com.apple.developer.networking.vpn.api: [allow-vpn]
    dependencies:
      - target: WSBridgeTunnel
      - target: WSBridgeLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WSBridgeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "lwip/**"
          - "lwipopts.h"
          - "lwip_bridge.h"
      - path: Tunnel/lwip
        headerVisibility: private
        excludes:
          - "**/makefsdata/**"
          - "**/makefsdata.c"
      - path: Tunnel/lwip_bridge.c
      - path: Tunnel/lwipopts.h
        headerVisibility: private
      - path: Tunnel/arch
        headerVisibility: private
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: WSBridge Tunnel
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/WSBridgeTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/WSBridgeTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Tunnel", "$(SRCROOT)/Tunnel/lwip/include"]
        GCC_C_LANGUAGE_STANDARD: c11
        CLANG_ENABLE_MODULES: NO

  # Live Activity (Dynamic Island / локскрин): молния + системный таймер
  # аптайма. UI живёт здесь, стартует/гасит активность приложение.
  WSBridgeLive:
    type: app-extension
    platform: iOS
    sources: [Live, Shared]
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: WSBridge Live
        CFBundleVersion: $(WSB_BUILD)
        CFBundleShortVersionString: $(WSB_MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.WSBridge.live

schemes:
  WSBridge:
    build:
      targets:
        WSBridge: all
